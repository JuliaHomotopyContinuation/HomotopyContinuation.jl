name = "lossless_powerflow_k4"
tier = "A"
description = "Lossless PV-bus power flow (equivalently Kuramoto equilibria) on the complete graph K4. Bus 0 is the slack/reference bus with angle 0 (x0 = 1, y0 = 0); for buses i = 1..3, x_i = cos(theta_i), y_i = sin(theta_i). Active power balance: sum_j b_ij sin(theta_i - theta_j) = P_i, with sin(theta_i - theta_j) = y_i x_j - x_i y_j. Parameters: 6 line susceptances b_ij and 3 injections P_i."
tags = [
  "power-flow",
  "kuramoto",
  "parameter-homotopy",
  "small",
]
variables = [
  "x1", "y1", "x2", "y2", "x3", "y3",
]
parameters = [
  "b01", "b02", "b03", "b12", "b13", "b23", "P1", "P2",
  "P3",
]
equations = [
  "b01*y1 + b12*(y1*x2 - x1*y2) + b13*(y1*x3 - x1*y3) - P1",
  "b02*y2 + b12*(y2*x1 - x2*y1) + b23*(y2*x3 - x2*y3) - P2",
  "b03*y3 + b13*(y3*x1 - x3*y1) + b23*(y3*x2 - x3*y2) - P3",
  "x1^2 + y1^2 - 1",
  "x2^2 + y2^2 - 1",
  "x3^2 + y3^2 - 1",
]

[source]
citation = "J. Baillieul, C. I. Byrnes, 'Geometric critical point analysis of lossless power system models', IEEE Trans. Circuits Syst. 29(11), 1982 (bound C(2n-2, n-1) for n buses); D. Mehta, H. D. Nguyen, K. Turitsyn, 'Numerical polynomial homotopy continuation method to locate all the power flow solutions', IET Gener. Transm. Distrib. 10(12), 2016; T. Chen, R. Davis, D. Mehta, 'Counting equilibria of the Kuramoto model using birationally invariant intersection index', SIAM J. Appl. Algebra Geom. 2(4), 2018. Formulation written for this collection (no copyable source file found)."
url = "https://doi.org/10.1109/TCS.1982.1085093"
file = ""

[solutions]
generic_nonsingular = 20
count_source = "Baillieul-Byrnes bound C(2n-2, n-1) = C(6,3) = 20 for n = 4 buses, attained for generic parameters on the complete graph (Chen-Davis-Mehta 2018). See [verification] for the HC.jl check."

[parametrization]
kind = "explicit"

[verification]
status = "verified"
method = "HC.jl monodromy_solve from a random start pair found by HC (find_start_pair), max_loops_no_progress = 10 finds 20; polyhedral solve at random complex parameters: 40 paths, 20 nonsingular. At one random real instance (positive b_ij, small P_i) 6 of the 20 are real."
hc_version = "2.22.4"
verified_count = 20
date = "2026-11-07"
