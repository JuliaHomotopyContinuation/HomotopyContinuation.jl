name = "steiner_conics"
tier = "A"
description = "Steiner's problem: conics f = a1 x^2 + a2 xy + a3 y^2 + a4 x + a5 y + 1 tangent to 5 given conics. For each given conic i (coefficients v1_i..v6_i) the unknown tangency point (y1_i, y2_i) lies on both conics and the gradients are parallel. 15 unknowns (a1..a5 and five tangency points), 30 parameters (coefficients of the five given conics)."
tags = [
  "enumerative-geometry",
  "parameter-homotopy",
  "large-count",
  "certification",
]
variables = [
  "a1", "a2", "a3", "a4", "a5", "y1_1", "y2_1", "y1_2",
  "y2_2", "y1_3", "y2_3", "y1_4", "y2_4", "y1_5", "y2_5",
]
parameters = [
  "v1_1", "v2_1", "v3_1", "v4_1", "v5_1", "v6_1", "v1_2", "v2_2",
  "v3_2", "v4_2", "v5_2", "v6_2", "v1_3", "v2_3", "v3_3", "v4_3",
  "v5_3", "v6_3", "v1_4", "v2_4", "v3_4", "v4_4", "v5_4", "v6_4",
  "v1_5", "v2_5", "v3_5", "v4_5", "v5_5", "v6_5",
]
equations = [
  "a1*y1_1^2 + a2*y1_1*y2_1 + a3*y2_1^2 + a4*y1_1 + a5*y2_1 + 1",
  "v1_1*y1_1^2 + v2_1*y1_1*y2_1 + v3_1*y2_1^2 + v4_1*y1_1 + v5_1*y2_1 + v6_1",
  "(2*a1*y1_1 + a2*y2_1 + a4)*(v2_1*y1_1 + 2*v3_1*y2_1 + v5_1) - (a2*y1_1 + 2*a3*y2_1 + a5)*(2*v1_1*y1_1 + v2_1*y2_1 + v4_1)",
  "a1*y1_2^2 + a2*y1_2*y2_2 + a3*y2_2^2 + a4*y1_2 + a5*y2_2 + 1",
  "v1_2*y1_2^2 + v2_2*y1_2*y2_2 + v3_2*y2_2^2 + v4_2*y1_2 + v5_2*y2_2 + v6_2",
  "(2*a1*y1_2 + a2*y2_2 + a4)*(v2_2*y1_2 + 2*v3_2*y2_2 + v5_2) - (a2*y1_2 + 2*a3*y2_2 + a5)*(2*v1_2*y1_2 + v2_2*y2_2 + v4_2)",
  "a1*y1_3^2 + a2*y1_3*y2_3 + a3*y2_3^2 + a4*y1_3 + a5*y2_3 + 1",
  "v1_3*y1_3^2 + v2_3*y1_3*y2_3 + v3_3*y2_3^2 + v4_3*y1_3 + v5_3*y2_3 + v6_3",
  "(2*a1*y1_3 + a2*y2_3 + a4)*(v2_3*y1_3 + 2*v3_3*y2_3 + v5_3) - (a2*y1_3 + 2*a3*y2_3 + a5)*(2*v1_3*y1_3 + v2_3*y2_3 + v4_3)",
  "a1*y1_4^2 + a2*y1_4*y2_4 + a3*y2_4^2 + a4*y1_4 + a5*y2_4 + 1",
  "v1_4*y1_4^2 + v2_4*y1_4*y2_4 + v3_4*y2_4^2 + v4_4*y1_4 + v5_4*y2_4 + v6_4",
  "(2*a1*y1_4 + a2*y2_4 + a4)*(v2_4*y1_4 + 2*v3_4*y2_4 + v5_4) - (a2*y1_4 + 2*a3*y2_4 + a5)*(2*v1_4*y1_4 + v2_4*y2_4 + v4_4)",
  "a1*y1_5^2 + a2*y1_5*y2_5 + a3*y2_5^2 + a4*y1_5 + a5*y2_5 + 1",
  "v1_5*y1_5^2 + v2_5*y1_5*y2_5 + v3_5*y2_5^2 + v4_5*y1_5 + v5_5*y2_5 + v6_5",
  "(2*a1*y1_5 + a2*y2_5 + a4)*(v2_5*y1_5 + 2*v3_5*y2_5 + v5_5) - (a2*y1_5 + 2*a3*y2_5 + a5)*(2*v1_5*y1_5 + v2_5*y2_5 + v4_5)",
]

[source]
citation = "P. Breiding, B. Sturmfels, S. Timme, '3264 Conics in a Second', Notices of the AMS 67(1), 2020 (arXiv:1902.05518). Formulation copied from HomotopyContinuation.jl test/test_systems.jl steiner()."
url = "https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl/blob/0cbf1e27d062d7eb01d962c3b948c39444c9a62c/test/test_systems.jl#L873-L900"
file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:873-900 (steiner)"

[solutions]
generic_nonsingular = 3264
count_source = "de Jonquières (1859) / Chasles (1864); HC.jl test/extensive/extensive_test.jl asserts nresults(only_nonsingular) == 3264 and certifies 3264 distinct solutions for random complex parameters."

[parametrization]
kind = "explicit"

[verification]
status = "verified"
method = "HC.jl monodromy_solve from a random start pair found by HC (find_start_pair), max_loops_no_progress = 10; 34 s"
hc_version = "2.22.4"
verified_count = 3264
date = "2026-11-07"
