name = "five_point_relative_pose"
tier = "A"
description = "Calibrated 5-point relative pose (vision), GPU-HC 'algebraic form with quaternion'. Parameters p1..p20 are the 5 point correspondences (4 image coordinates each: p_{4k+1..4k+4} for point k); unknowns x1,x2 parametrize the translation (third coordinate fixed), x3..x6 a unit quaternion (x6^2 + x3^2 + x4^2 + x5^2 = 1). Each equation is the epipolar constraint of one correspondence."
tags = [
  "vision",
  "minimal-problem",
  "relative-pose",
  "parameter-homotopy",
]
variables = [
  "x1", "x2", "x3", "x4", "x5", "x6",
]
parameters = [
  "p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8",
  "p9", "p10", "p11", "p12", "p13", "p14", "p15", "p16",
  "p17", "p18", "p19", "p20",
]
