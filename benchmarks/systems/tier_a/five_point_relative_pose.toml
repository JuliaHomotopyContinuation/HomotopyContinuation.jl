[source]
citation = "C.-H. Chien, H. Fan, A. Abdelfattah, E. Tsigaridas, S. Tomov, B. Kimia, 'GPU-Based Homotopy Continuation for Minimal Problems in Computer Vision', CVPR 2022 (formulation from the GPU-HC journal version). Problem: D. Nister, 'An efficient solution to the five-point relative pose problem', IEEE TPAMI 26(6), 2004."
url = "https://github.com/Brown-LEMS/Homotopy-Continuation-Tracker-on-GPU/blob/67df2ab3582eef0ee2aa8e6d3a1c2274ab5105b5/auto-data-gen-tools/p2c-problems/sys_5pt_rel_pos_alg_form_quat.m"
file = "Homotopy-Continuation-Tracker-on-GPU@67df2ab3582eef0ee2aa8e6d3a1c2274ab5105b5:auto-data-gen-tools/p2c-problems/sys_5pt_rel_pos_alg_form_quat.m; start/target data in GPU-HC/problems/5pt_rel_pos_alg_form_quat/{start_params,start_sols,target_params}.txt"

[solutions]
generic_nonsingular = 40
count_source = "Nister 2004: 10 essential matrices (complex); each gives 2 rotations (twisted pair) x 2 quaternion signs = 40 solutions in this formulation. GPU-HC gpuhc_settings.yaml: Num_Of_Tracks 40."

[parametrization]
kind = "explicit"

[start_data]
format = "GPU-HC text: one complex number per line as 'real<TAB>imag'; start_sols.txt lists all solutions consecutively (num_vars lines each)."
start_parameters = "GPU-HC/problems/5pt_rel_pos_alg_form_quat/start_params.txt"
start_solutions = "GPU-HC/problems/5pt_rel_pos_alg_form_quat/start_sols.txt"
target_parameters = "GPU-HC/problems/5pt_rel_pos_alg_form_quat/target_params.txt"

[verification]
status = "verified"
method = "All 40 GPU-HC start solutions have residual <= 1.6e-13 at the GPU-HC start parameters; HC.jl monodromy_solve from the first one finds 40 (10 s)."
