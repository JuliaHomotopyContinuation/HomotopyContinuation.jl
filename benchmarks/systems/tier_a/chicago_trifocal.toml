[source]
citation = "R. Fabbri, T. Duff, H. Fan, M. Regan, D. da Costa de Pinho, E. Tsigaridas, C. Wampler, J. Hauenstein, P. Giblin, B. Kimia, A. Leykin, T. Pajdla, 'Trifocal Relative Pose from Lines at Points', IEEE TPAMI 45(6), 2022 (CVPR 2020 version: 'TRPLP'); T. Duff, K. Kohn, A. Leykin, T. Pajdla, 'PLMP - Point-Line Minimal Problems in Complete Multi-View Visibility', ICCV 2019. Equations copied from GPU-HC sys_trifocal_2op1p_30x30.m. The original 'MINUS' C++ solver is github.com/rfabbri/minus."
