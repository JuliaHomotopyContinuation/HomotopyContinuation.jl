[solutions]
generic_nonsingular = 312
count_source = "Duff-Kohn-Leykin-Pajdla ICCV 2019 and Fabbri et al. TPAMI 2022: degree 312; GPU-HC gpuhc_settings.yaml Num_Of_Tracks 312 (start_sols.txt holds 312 x 30 values)."

[parametrization]
kind = "explicit"
notes = "Full equations are small enough to store (30 equations, <= 20 terms each). Larger GPU-HC/MINUS variants (e.g. the 312-solution 14x14 formulation in MINUS, generalized_3views_6lines with 600 solutions) are pointer-only: see the GPU-HC p2c-problems directory."

[start_data]
