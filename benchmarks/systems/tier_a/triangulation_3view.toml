name = "triangulation_3view"
tier = "A"
description = "Optimal 3-view triangulation (L2 reprojection error) via Lagrange multipliers, GPU-HC formulation: unknowns are the corrected image points (2 per view) and one Lagrange multiplier per epipolar constraint between consecutive views (views 1-2, 2-3); parameters are the fundamental-matrix entries of consecutive view pairs (9 per pair, 3rd row/col folded in) and the measured image points (2 per view)."
tags = [
  "vision",
  "triangulation",
  "critical-points",
  "optimization",
  "parameter-homotopy",
  "gpu-hc",
]
variables = [
  "x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8",
]
parameters = [
  "p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8",
  "p9", "p10", "p11", "p12", "p13", "p14", "p15", "p16",
  "p17", "p18", "p19", "p20", "p21", "p22", "p23", "p24",
]
equations = [
  "2*x1 + p1*x3*x7 + p2*x4*x7 + p3*x7 - 2*p19",
  "2*x2 + p4*x3*x7 + p5*x4*x7 + p6*x7 - 2*p20",
  "p1*x1*x7 + p4*x2*x7 + 2*x3 + p10*x5*x8 + p11*x6*x8 + p7*x7 + p12*x8 - 2*p21",
  "p2*x1*x7 + p5*x2*x7 + 2*x4 + p13*x5*x8 + p14*x6*x8 + p8*x7 + p15*x8 - 2*p22",
  "p10*x3*x8 + p13*x4*x8 + 2*x5 + p16*x8 - 2*p23",
  "p11*x3*x8 + p14*x4*x8 + 2*x6 + p17*x8 - 2*p24",
  "p1*x1*x3 + p2*x1*x4 + p3*x1 + p4*x2*x3 + p5*x2*x4 + p6*x2 + p7*x3 + p8*x4 + p9",
  "p10*x3*x5 + p11*x3*x6 + p12*x3 + p13*x4*x5 + p14*x4*x6 + p15*x4 + p16*x5 + p17*x6 + p18",
]

[source]
citation = "M. Byrod, K. Josephson, K. Astrom, 'Fast optimal three view triangulation', ACCV 2007; C.-H. Chien, H. Fan, A. Abdelfattah, E. Tsigaridas, S. Tomov, B. Kimia, 'GPU-Based Homotopy Continuation for Minimal Problems in Computer Vision', CVPR 2022. Equations copied from GPU-HC."
url = "https://github.com/Brown-LEMS/Homotopy-Continuation-Tracker-on-GPU/blob/67df2ab3582eef0ee2aa8e6d3a1c2274ab5105b5/auto-data-gen-tools/p2c-problems/sys_3view_triangulation.m"
file = "Homotopy-Continuation-Tracker-on-GPU@67df2ab3582eef0ee2aa8e6d3a1c2274ab5105b5:auto-data-gen-tools/p2c-problems/sys_3view_triangulation.m; start/target data in GPU-HC/problems/3view_triangulation/"

[solutions]
generic_nonsingular = 31
count_source = "GPU-HC gpuhc_settings.yaml Num_Of_Tracks = 31 (number of start solutions obtained by monodromy). Note: this formulation imposes only the epipolar constraints of consecutive view pairs, so its count differs from the 47 stationary points of exact 3-view triangulation (Stewenius-Schaffalitzky-Nister, ICCV 2005)."

[parametrization]
kind = "explicit"

[start_data]
format = "GPU-HC text: one complex number per line as 'real<TAB>imag'."
start_parameters = "GPU-HC/problems/3view_triangulation/start_params.txt"
start_solutions = "GPU-HC/problems/3view_triangulation/start_sols.txt"
target_parameters = "GPU-HC/problems/3view_triangulation/target_params.txt"

[verification]
status = "verified"
method = "All 31 GPU-HC start solutions have residual <= 8.4e-12; HC.jl monodromy_solve from the first one finds 31."
hc_version = "2.22.4"
verified_count = 31
date = "2026-11-07"
