name = "eco8"
tier = "B"
description = "8-dimensional economics problem (Morgan): (x_k + sum_{i=1..n-k-1} x_i x_{i+k}) x_n = k for k = 1..n-1, and x_1 + ... + x_{n-1} + 1 = 0. Many paths diverge in total-degree homotopies (total degree 1458 vs 64 solutions)."
tags = [
  "stress",
  "coefficient-parameter",
  "diverging-paths",
]
variables = [
  "x1", "x2", "x3", "x4", "x5", "x6", "x7", "x8",
]
parameters = []
equations = [
  "(x1 + x1*x2 + x2*x3 + x3*x4 + x4*x5 + x5*x6 + x6*x7)*x8 - 1",
  "(x2 + x1*x3 + x2*x4 + x3*x5 + x4*x6 + x5*x7)*x8 - 2",
  "(x3 + x1*x4 + x2*x5 + x3*x6 + x4*x7)*x8 - 3",
  "(x4 + x1*x5 + x2*x6 + x3*x7)*x8 - 4",
  "(x5 + x1*x6 + x2*x7)*x8 - 5",
  "(x6 + x1*x7)*x8 - 6",
  "(x7)*x8 - 7",
  "x1 + x2 + x3 + x4 + x5 + x6 + x7 + 1",
]

[source]
citation = "A. Morgan, 'Solving polynomial systems using continuation for engineering and scientific problems', Prentice-Hall 1987, p. 148. PHCpack Demo/eco8."
