name = "cyclic7"
tier = "B"
description = "Cyclic 7-roots: elementary cyclic sums sum_j prod_{k=0..m} z_{(j+k) mod n} = 0 for m = 0..n-2 and z0*...*z6 = 1."
tags = [
  "stress",
  "coefficient-parameter",
  "symmetric",
  "polyhedral",
]
variables = [
  "z0", "z1", "z2", "z3", "z4", "z5", "z6",
]
parameters = []
equations = [
  "z0 + z1 + z2 + z3 + z4 + z5 + z6",
  "z0*z1 + z1*z2 + z2*z3 + z3*z4 + z4*z5 + z5*z6 + z6*z0",
  "z0*z1*z2 + z1*z2*z3 + z2*z3*z4 + z3*z4*z5 + z4*z5*z6 + z5*z6*z0 + z6*z0*z1",
  "z0*z1*z2*z3 + z1*z2*z3*z4 + z2*z3*z4*z5 + z3*z4*z5*z6 + z4*z5*z6*z0 + z5*z6*z0*z1 + z6*z0*z1*z2",
  "z0*z1*z2*z3*z4 + z1*z2*z3*z4*z5 + z2*z3*z4*z5*z6 + z3*z4*z5*z6*z0 + z4*z5*z6*z0*z1 + z5*z6*z0*z1*z2 + z6*z0*z1*z2*z3",
  "z0*z1*z2*z3*z4*z5 + z1*z2*z3*z4*z5*z6 + z2*z3*z4*z5*z6*z0 + z3*z4*z5*z6*z0*z1 + z4*z5*z6*z0*z1*z2 + z5*z6*z0*z1*z2*z3 + z6*z0*z1*z2*z3*z4",
  "z0*z1*z2*z3*z4*z5*z6 - 1",
]

[source]
citation = "G. Bjorck, R. Froberg, 'A faster way to count the solutions of inhomogeneous systems of algebraic equations, with applications to cyclic n-roots', J. Symb. Comp. 12 (1991); J. Backelin, R. Froberg, 'How we proved that there are exactly 924 cyclic 7-roots', ISSAC 1991. Same system as HC.jl test/test_systems.jl cyclic(n) and PHCpack Demo/cyclic7."
url = "https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl/blob/0cbf1e27d062d7eb01d962c3b948c39444c9a62c/test/test_systems.jl#L72-L77"
file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:72-77 (cyclic); PHCpack@ed77cc0234aec45099d1d587a90a1617d5bfdacd:src/Demo/cyclic7"

[solutions]
generic_nonsingular = 924
count_source = "Backelin-Froberg 1991: exactly 924 cyclic 7-roots; mixed volume 924 (PHCpack Demo/cyclic7). HC.jl test/endgame_test.jl and test/solve_test.jl assert nsolutions == 924 (total degree 5040)."

