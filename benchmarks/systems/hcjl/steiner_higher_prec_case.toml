[solutions]
generic_nonsingular = 3264
count_source = "Same system as tier_a/steiner_conics.toml."
expected_outcome = "track(Tracker(ParameterHomotopy(F, p, q); automatic_differentiation = AD), s_p, 1, 0) succeeds with solution ~ s_q, and tracking that back (0 -> 1) returns ~ s_p, for AD = 1, 2, 3."

[parametrization]
kind = "explicit"

[hcjl]
function = "steiner() (test/test_systems.jl:873-900) and test/test_cases/steiner_higher_prec.jl"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_cases/steiner_higher_prec.jl:1-153"
parametrization = "parameters vec(v) (6 x 5 conic coefficients, column-major), unknowns [a; vec(y)]."
how_solved = "Single path forward and backward with ParameterHomotopy. steiner() itself: test/certification_test.jl and test/extensive/extensive_test.jl solve(F; target_parameters = randn(ComplexF64, 30)) (default polyhedral start), expect 3264 and certify; then a parameter homotopy to the 'real_conics' instance with 3264 real solutions (test/data/3264_real_sols.txt)."
used_in = "benchmarks/run_system_benchmark.jl times evaluate!, evaluate_and_jacobian! and taylor! of every system in TEST_SYSTEM_COLLECTION (test/test_systems.jl:1003-1018) for InterpretedSystem and CompiledSystem at random x and p; it does not solve them."

[verification]
status = "verified"
method = "HC.jl Tracker(ParameterHomotopy(F, p, q)) from s_p: :success for AD = 0..3 (104 steps), |solution - s_q| = 4.6e-15; residuals |F(s_p, p)| = 1.2e-12, |F(s_q, q)| = 1.8e-14."
