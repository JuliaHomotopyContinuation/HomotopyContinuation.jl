[source]
citation = "A. Kulkarni, Y. Ren, M. Sayyary Namin, B. Sturmfels, 'Real space sextics and their tritangents', ISSAC 2018; HC.jl example https://www.juliahomotopycontinuation.org/examples/tritangents/."
url = "https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl/blob/0cbf1e27d062d7eb01d962c3b948c39444c9a62c/test/test_systems.jl#L31-L53"
file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:31-53 (Tritangtens); benchmarks/tritangents.jl"

[solutions]
generic_nonsingular = 720
count_source = "120 tritangent planes of a generic space sextic of genus 4, times 3! orderings of the contact points = 720. HC.jl benchmarks/tritangents.jl: nnonsingular(solve(f)) 'should be 720' (total degree and polyhedral) for PolynomialTestSystems.jl tritangents() (fixed random cubic)."

[parametrization]
kind = "explicit"

[hcjl]
function = "Tritangtens()"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:31-53"
parametrization = "parameters = the 20 coefficients c of the dense cubic (dense_poly(x, 3, coeff_name = :c))."
how_solved = "In TEST_SYSTEM_COLLECTION (evaluation benchmark only). benchmarks/tritangents.jl solves PolynomialTestSystems.tritangents() (same system with a fixed random complex cubic, different coefficient order) with solve(f) and solve(f; start_system = :polyhedral) and expects 720 nonsingular solutions."
used_in = "benchmarks/run_system_benchmark.jl times evaluate!, evaluate_and_jacobian! and taylor! of every system in TEST_SYSTEM_COLLECTION (test/test_systems.jl:1003-1018) for InterpretedSystem and CompiledSystem at random x and p; it does not solve them."

[verification]
status = "verified"
method = "HC.jl monodromy_solve from a random start pair found by HC (find_start_pair), max_loops_no_progress = 10; 69 s. Transcription equals HC.jl Tritangtens() (rel. err. 3e-16)."
hc_version = "2.22.4"
verified_count = 720
