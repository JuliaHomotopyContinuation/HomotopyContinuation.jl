[solutions]
generic_nonsingular = 8652
count_source = "Same system as tier_a/alt_nine_point_four_bar.toml (8652 for generic parameters)."
expected_outcome = "track(Tracker(ParameterHomotopy(F, p, q); options = TrackerOptions(automatic_differentiation = AD)), s, 1, 0) is_success for AD = 0, 1, 2, 3 (HC.jl's t runs from 1 at p to 0 at q)."

[parametrization]
kind = "explicit"
notes = "Relation to tier_a/alt_nine_point_four_bar.toml: identical system; that file is the full 8652-path parameter-homotopy benchmark, this file is the single hard path from HC.jl's tracker tests."

[hcjl]
function = "four_bar() (test/test_systems.jl:954-979) and test/test_cases/four_bar.jl"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_cases/four_bar.jl:1-97"
parametrization = "parameters [delta; delta_hat] (16), unknowns [x; a; y; b; x_hat; a_hat; y_hat; b_hat; gamma; gamma_hat] (24)."
how_solved = "test/tracker_test.jl includes test_cases/four_bar.jl: one path, ParameterHomotopy(F, p, q), track(tracker, s, 1, 0) for automatic_differentiation = 0:3, expects is_success. four_bar() is also in TEST_SYSTEM_COLLECTION (evaluation benchmark). The HC.jl website example 'Alt's problem' solves the full problem by monodromy with the cognate/relabeling group action."
used_in = "benchmarks/run_system_benchmark.jl times evaluate!, evaluate_and_jacobian! and taylor! of every system in TEST_SYSTEM_COLLECTION (test/test_systems.jl:1003-1018) for InterpretedSystem and CompiledSystem at random x and p; it does not solve them."

