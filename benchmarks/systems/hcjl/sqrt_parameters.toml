name = "sqrt_parameters"
tier = "HC"
description = "Polynomial in the unknowns, non-polynomial (sqrt) in the parameters: [sqrt(a + b) x^2 - y, (x y + a - sqrt(b))^2 - 3]. Eliminating y = sqrt(a + b) x^2 gives (sqrt(a + b) x^3 + a - sqrt(b))^2 = 3, so 6 solutions. Tests homotopies whose coefficients are non-polynomial functions of the parameters."
tags = [
  "non-polynomial-parameters",
  "sqrt",
  "small",
  "hcjl",
]
variables = [
  "x", "y",
]
parameters = [
  "a", "b",
]
equations = [
  "-y + x^2*sqrt(a + b)",
  "-3 + (a + x*y - sqrt(b))^2",
]

[source]
citation = "HomotopyContinuation.jl test/test_systems.jl sqrt_parameters()."
