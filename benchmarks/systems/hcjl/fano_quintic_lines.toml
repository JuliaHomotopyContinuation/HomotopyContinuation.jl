[source]
citation = "Schubert calculus: 2875 lines on a generic quintic threefold (H. Schubert 1879; S. Katz 1986). HC.jl test/extensive/extensive_test.jl 'Lines on a quintic surface in 3-space'."
url = "https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl/blob/0cbf1e27d062d7eb01d962c3b948c39444c9a62c/test/test_systems.jl#L730-L870"
file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:730-870 (fano_quintic)"

[solutions]
generic_nonsingular = 2875
count_source = "Classical count 2875; HC.jl test/extensive/extensive_test.jl asserts nsolutions == 2875 (total degree and polyhedral) and certifies 2875 distinct solutions."

[parametrization]
kind = "explicit"

[hcjl]
function = "fano_quintic()"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:730-870"
parametrization = "parameters q = coefficients of the dense quintic except the constant (fixed to 1). The function body also defines a 14-entry vector q0 and gamma = 0.63 - 0.52im, but returns only the System."
how_solved = "test/extensive/extensive_test.jl: solve(sys; gamma, target_parameters = q0, start_system = :total_degree) and with :polyhedral, expects 2875 and certifies. That test destructures `sys, q0, gamma = fano_quintic()`, which no longer matches the function's return value (stale test). test/endgame_test.jl has a commented-out 'ill-conditioned solution' test on start solution 1785."
used_in = "benchmarks/run_system_benchmark.jl times evaluate!, evaluate_and_jacobian! and taylor! of every system in TEST_SYSTEM_COLLECTION (test/test_systems.jl:1003-1018) for InterpretedSystem and CompiledSystem at random x and p; it does not solve them."

[verification]
status = "verified"
method = "HC.jl monodromy_solve from a random start pair found by HC (find_start_pair), max_loops_no_progress = 10; 278 s. Transcription equals HC.jl fano_quintic() (rel. err. 2e-16)."
hc_version = "2.22.4"
verified_count = 2875
date = "2026-11-07"
