  "steady-states",
  "parameter-homotopy",
  "consistency",
  "hcjl",
]
variables = [
  "x1", "x2", "x3",
]
parameters = [
  "p1", "p2", "p3", "p4", "p5", "p6", "p7", "p8",
  "p9", "p10",
]
equations = [
  "p1 - p2*x1 - p3*x1*x3",
  "-p4*x2*p10 - p4*x2*x3 - p6*p5*x2*p10 - p6*p5*x2*x3 + p8*p7*p9*x1*x3 + p8*p9*x2*x1*x3",
