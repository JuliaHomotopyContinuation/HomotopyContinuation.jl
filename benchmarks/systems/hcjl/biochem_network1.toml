file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:benchmarks/bio-chemical-rection-networks.jl:19-44"

[solutions]
generic_nonsingular = 3
count_source = "No count stated in HC.jl. Computed here with HC.jl 2.22.4 (polyhedral solve at random complex parameters and monodromy agree: 3). At target_parameters: 3 nonsingular, 1 real."

[parametrization]
kind = "explicit"
notes = "target_parameters = p_vals of the benchmark (note p6 = 0, a degenerate value)."

[hcjl]
function = "pol (network 1)"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:benchmarks/bio-chemical-rection-networks.jl:19-44"
parametrization = "p[1:10]."
how_solved = "benchmarks/bio-chemical-rection-networks.jl (sent by Torkel Loman for the BioDiffEq / Catalyst integration) runs N = 1000 times: (a) a direct solve(...) at the given real parameters, and (b) solve at random complex parameters followed by a parameter homotopy (solve(pol, sols; parameters, p1 = template, p0 = target)) to the target; it tallies the number of solutions found and expects (a) and (b) to agree in every run."
used_in = "benchmarks/bio-chemical-rection-networks.jl"

[verification]
