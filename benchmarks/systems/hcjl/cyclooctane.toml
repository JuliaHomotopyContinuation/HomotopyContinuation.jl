name = "cyclooctane"
tier = "HC"
description = "Conformation space of cyclooctane (2-dimensional variety in C^17) sliced by 2 affine-linear equations A z = b, i.e. a witness-set (linear-slice) parameter homotopy. Eight carbon atoms P0..P7 with P0 = 0, P7 = (sqrt(2), 0, 0), P6 = (z1_6, z2_6, 0); squared bond length c^2 = 2 between neighbours and 8c^2/3 = 16/3 between atoms two apart. The first 15 equations are HC.jl cyclo(); the last 2 are the slice from benchmarks/cyclooctane.jl. Parameters: A (2 x 17, A{row}_{col}) and b."
tags = [
  "chemistry",
  "molecular-conformation",
  "witness-set",
  "positive-dimensional",
  "parameter-homotopy",
  "hcjl",
]
variables = [
  "z1_1", "z2_1", "z3_1", "z1_2", "z2_2", "z3_2", "z1_3", "z2_3",
  "z3_3", "z1_4", "z2_4", "z3_4", "z1_5", "z2_5", "z3_5", "z1_6",
  "z2_6",
]
parameters = [
  "A1_1", "A2_1", "A1_2", "A2_2", "A1_3", "A2_3", "A1_4", "A2_4",
  "A1_5", "A2_5", "A1_6", "A2_6", "A1_7", "A2_7", "A1_8", "A2_8",
  "A1_9", "A2_9", "A1_10", "A2_10", "A1_11", "A2_11", "A1_12", "A2_12",
  "A1_13", "A2_13", "A1_14", "A2_14", "A1_15", "A2_15", "A1_16", "A2_16",
  "A1_17", "A2_17", "b1", "b2",
]
equations = [
  "z1_1^2 + z2_1^2 + z3_1^2 - 2",
  "(z1_1 - z1_2)^2 + (z2_1 - z2_2)^2 + (z3_1 - z3_2)^2 - 2",
  "(z1_2 - z1_3)^2 + (z2_2 - z2_3)^2 + (z3_2 - z3_3)^2 - 2",
  "(z1_3 - z1_4)^2 + (z2_3 - z2_4)^2 + (z3_3 - z3_4)^2 - 2",
  "(z1_4 - z1_5)^2 + (z2_4 - z2_5)^2 + (z3_4 - z3_5)^2 - 2",
  "(z1_5 - z1_6)^2 + (z2_5 - z2_6)^2 + z3_5^2 - 2",
  "(z1_6 - 1.4142135623730951)^2 + z2_6^2 - 2",
  "z1_2^2 + z2_2^2 + z3_2^2 - 16/3",
  "(z1_1 - z1_3)^2 + (z2_1 - z2_3)^2 + (z3_1 - z3_3)^2 - 16/3",
  "(z1_2 - z1_4)^2 + (z2_2 - z2_4)^2 + (z3_2 - z3_4)^2 - 16/3",
  "(z1_3 - z1_5)^2 + (z2_3 - z2_5)^2 + (z3_3 - z3_5)^2 - 16/3",
  "(z1_4 - z1_6)^2 + (z2_4 - z2_6)^2 + z3_4^2 - 16/3",
  "(z1_5 - 1.4142135623730951)^2 + z2_5^2 + z3_5^2 - 16/3",
  "z1_6^2 + z2_6^2 - 16/3",
  "(1.4142135623730951 - z1_1)^2 + z2_1^2 + z3_1^2 - 16/3",
  "A1_1*z1_1 + A1_2*z2_1 + A1_3*z3_1 + A1_4*z1_2 + A1_5*z2_2 + A1_6*z3_2 + A1_7*z1_3 + A1_8*z2_3 + A1_9*z3_3 + A1_10*z1_4 + A1_11*z2_4 + A1_12*z3_4 + A1_13*z1_5 + A1_14*z2_5 + A1_15*z3_5 + A1_16*z1_6 + A1_17*z2_6 - b1",
  "A2_1*z1_1 + A2_2*z2_1 + A2_3*z3_1 + A2_4*z1_2 + A2_5*z2_2 + A2_6*z3_2 + A2_7*z1_3 + A2_8*z2_3 + A2_9*z3_3 + A2_10*z1_4 + A2_11*z2_4 + A2_12*z3_4 + A2_13*z1_5 + A2_14*z2_5 + A2_15*z3_5 + A2_16*z1_6 + A2_17*z2_6 - b2",
