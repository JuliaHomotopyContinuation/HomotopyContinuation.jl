[source]
citation = "S. Martin, A. Thompson, E. A. Coutsias, J.-P. Watson, 'Topology of cyclo-octane energy landscape', J. Chem. Phys. 132, 2010; HC.jl example https://www.juliahomotopycontinuation.org/examples/cyclooctane/."
url = "https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl/blob/0cbf1e27d062d7eb01d962c3b948c39444c9a62c/benchmarks/cyclooctane.jl#L1-L29"
file = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:57-70 (cyclo, 15 equations, no slice); benchmarks/cyclooctane.jl (sliced version)"

[solutions]
generic_nonsingular = 1408
count_source = "HC.jl benchmarks/cyclooctane.jl: 'Degree of the variety: nfinite(complex_result) # should be 1408' (total-degree solve of one random complex slice). See [verification]. The variety is reducible: monodromy from one witness point only finds the points of one component (632 found with HC.jl 2.22.4), so a single monodromy run does NOT recover 1408."

[parametrization]
kind = "explicit"
notes = "sqrt(2) is stored as the Float64 literal 1.4142135623730951 (HC.jl uses sqrt(c^2) in Float64)."

[hcjl]
function = "cyclo() and benchmarks/cyclooctane.jl"
location = "HomotopyContinuation.jl@0cbf1e27d062d7eb01d962c3b948c39444c9a62c:test/test_systems.jl:57-70; benchmarks/cyclooctane.jl:1-29"
parametrization = "cyclo() has no parameters (15 equations in 17 unknowns). benchmarks/cyclooctane.jl appends A z - b with parameters vec(A) (2 x 17) and b, i.e. our parameter order is vec(A) column-major followed by b."
how_solved = "benchmarks/cyclooctane.jl: solve(F0) (default start system) for one random complex (A0, b0); expects nfinite = 1408. cyclo() itself is in TEST_SYSTEM_COLLECTION (evaluation benchmark only)."
used_in = "benchmarks/run_system_benchmark.jl times evaluate!, evaluate_and_jacobian! and taylor! of every system in TEST_SYSTEM_COLLECTION (test/test_systems.jl:1003-1018) for InterpretedSystem and CompiledSystem at random x and p; it does not solve them."

[verification]
status = "partial"
method = "HC.jl monodromy_solve finds only 632 witness points (one irreducible component). Full solve: pending."
hc_version = "2.22.4"
date = "2026-11-07"
